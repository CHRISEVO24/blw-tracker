name: Scrape BLW Inventory

on:
  repository_dispatch:
    types: [scrape]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download current history.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -sf \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/history.json" \
            -o history.json || echo "{}" > history.json

      - name: Run scraper
        run: node scrape.js

      - name: Push history.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 push_history.py
